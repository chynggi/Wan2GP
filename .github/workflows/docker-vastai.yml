name: Build vast.ai image (CUDA 13.0)

on:
  workflow_dispatch:
    inputs:
      extra_tags:
        description: "추가 태그 (쉼표 구분, ghcr 태그만)"
        required: false
        default: ""
      max_jobs:
        description: "nvcc 병렬度 (OOM 시 2)"
        required: false
        default: "4"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Compute image tags
        id: meta
        env:
          EXTRA_TAGS: ${{ inputs.extra_tags }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          SHORT="$(git rev-parse --short=7 HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          echo "tag=${SHORT}-${DATE}-cuda-13.0" >> "$GITHUB_OUTPUT"
          EXTRA=""
          for t in $(echo "$EXTRA_TAGS" | tr ',' ' '); do
            [ -n "$t" ] && EXTRA="${EXTRA}${EXTRA:+,}ghcr.io/${REPO_OWNER}/wan2gp:${t}"
          done
          echo "extra=${EXTRA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vastai
          push: true
          build-args: |
            CUDA_ARCHITECTURES=12.0
            MAX_JOBS=${{ inputs.max_jobs }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/wan2gp:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/wan2gp:cuda-13.0
            ${{ steps.meta.outputs.extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
